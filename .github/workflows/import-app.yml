              (p/'prepare.py').write_text("\"\"\"Prepare one previously verified app snapshot for a standalone import repository.\"\"\"\nfrom pathlib import Path\nimport json, shutil, subprocess, sys, hashlib\n\nsource, target, spec_file, server_file = map(Path, sys.argv[1:])\nspec = json.loads(spec_file.read_text())\nexpected = spec['files']\nfor entry in expected:\n    src = source / entry['source_path']\n    dst = target / entry['path']\n    if not dst.resolve().is_relative_to(target.resolve()):\n        raise ValueError('Unsafe target path')\n    data = src.read_bytes()\n    sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\\0' + data).hexdigest()\n    if sha != entry['sha']:\n        raise ValueError('Source verification failed: ' + entry['source_path'])\n    dst.parent.mkdir(parents=True, exist_ok=True)\n    if dst.exists() and dst.read_bytes() != data and entry['path'] != 'README.md':\n        raise ValueError('Refusing to overwrite existing work: ' + entry['path'])\n    dst.write_bytes(data)\n    dst.chmod(0o755 if entry['mode'] == '100755' else 0o644)\n\nnotes = [f\"# {spec['title']} — AI Studio import\", '', 'Created by Drew Wichman.', '',\n    'Preserve the existing app, artwork, audio, controls and file formats. This is a transfer of an existing app, not a request to redesign or simplify it.', '',\n    f\"Source: {spec['source_repository']} at {spec['source_commit']}. All {len(expected)} original files were verified against their Git blob hashes.\", '',\n    'This is an independent copy. Existing Sites and the arcade index are unchanged. Browser-saved projects must be exported from the original app and imported here when supported.', '']\nif spec['kind'].startswith('static'):\n    if (target/'app-runtime').exists():\n        raise ValueError('Unexpected existing app-runtime directory')\n    shutil.copytree(target/'dist', target/'app-runtime')\n    package_path = target / 'package.json'\n    package = json.loads(package_path.read_text()) if package_path.exists() else {'name':spec['slug'],'version':'1.0.0','private':True}\n    if package_path.exists():\n        (target/'package.original.json').write_text(package_path.read_text())\n    scripts = package.setdefault('scripts', {})\n    for name in ['dev','start','build']:\n        if name in scripts: scripts[name+':original'] = scripts[name]\n    scripts.update({'dev':'node aistudio-server.mjs','start':'node aistudio-server.mjs','build':'node --check aistudio-server.mjs'})\n    package_path.write_text(json.dumps(package, indent=2)+'\\n')\n    shutil.copy2(server_file, target/'aistudio-server.mjs')\n    notes.extend(['## Run', '', '`npm run dev` serves `app-runtime/` on port 3000, using the existing HTML and JavaScript. The dependency-free Node server supports byte-range audio and video requests. `PORT` and `--port` can override the port. Edit the app-runtime files in AI Studio; dist is an exact archival copy because AI Studio excludes build output folders. Original package scripts remain available with an :original suffix.', ''])\n    if spec.get('backend'):\n        notes.extend(['## Existing backend', '', f\"The shared Listening Room still calls {spec['backend']}. Its existing server source is included. Verify cross-origin access from AI Studio before claiming that server-backed features work. Do not expose owner moderation or remove validation.\", ''])\nelse:\n    notes.extend(['## Runtime adaptation required', '', 'The complete source is preserved. This project originally uses Cloudflare/Vinext. Adapt the development server and any storage/auth/MCP routes to AI Studio’s Node environment, preserving all features and assets. Do not claim that a source import alone verifies the runtime. Keep original configurations before changing them.', ''])\n(target/'AI-STUDIO-IMPORT.md').write_text('\\n'.join(notes)+'\\n')\n(target/'import-provenance.json').write_text(json.dumps({k:v for k,v in spec.items() if k!='files'},indent=2)+'\\n')\nprint(f\"Prepared {spec['slug']}: verified {len(expected)} original files\")\n")
              (p/'server.mjs').write_text("import http from 'node:http';\nimport { stat, realpath } from 'node:fs/promises';\nimport { createReadStream } from 'node:fs';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst root = await realpath(path.join(path.dirname(fileURLToPath(import.meta.url)), 'app-runtime'));\nconst args = process.argv.slice(2);\nconst flag = name => { const i = args.indexOf(name); return i < 0 ? undefined : args[i + 1]; };\nconst port = Number(flag('--port') || process.env.PORT || 3000);\nconst mime = {'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.mjs':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json','.wasm':'application/wasm','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.gif':'image/gif','.ico':'image/x-icon','.wav':'audio/wav','.mp3':'audio/mpeg','.ogg':'audio/ogg','.m4a':'audio/mp4','.mp4':'video/mp4','.webm':'video/webm','.woff':'font/woff','.woff2':'font/woff2','.ttf':'font/ttf','.otf':'font/otf','.txt':'text/plain; charset=utf-8','.pdf':'application/pdf'};\nconst server = http.createServer(async (req, res) => {\n  if (!['GET','HEAD'].includes(req.method)) { res.writeHead(405, {Allow:'GET, HEAD'}); return res.end(); }\n  try {\n    const url = new URL(req.url, 'http://localhost');\n    const pathname = decodeURIComponent(url.pathname);\n    let target = path.resolve(root, '.' + pathname);\n    if (target !== root && !target.startsWith(root + path.sep)) { res.writeHead(403); return res.end(); }\n    let info = await stat(target);\n    if (info.isDirectory()) {\n      if (!pathname.endsWith('/')) { res.writeHead(301, {Location:url.pathname+'/' + url.search}); return res.end(); }\n      target = path.join(target, 'index.html'); info = await stat(target);\n    }\n    target = await realpath(target);\n    if (!target.startsWith(root + path.sep) || !info.isFile()) { res.writeHead(403); return res.end(); }\n    const headers = {'Content-Type':mime[path.extname(target).toLowerCase()] || 'application/octet-stream','Cache-Control':'no-store','Accept-Ranges':'bytes','X-Content-Type-Options':'nosniff'};\n    let start = 0, end = info.size - 1, status = 200;\n    if (req.headers.range) {\n      const match = /^bytes=(\\d*)-(\\d*)$/.exec(req.headers.range);\n      let valid = !!match && !!(match[1] || match[2]) && info.size > 0;\n      if (valid) {\n        if (!match[1]) start = Math.max(0, info.size - Number(match[2]));\n        else { start = Number(match[1]); if (match[2]) end = Math.min(end, Number(match[2])); }\n        valid = Number.isSafeInteger(start) && Number.isSafeInteger(end) && start >= 0 && end >= start && start < info.size;\n      }\n      if (!valid) { res.writeHead(416, {...headers, 'Content-Range':`bytes */${info.size}`}); return res.end(); }\n      status = 206; headers['Content-Range'] = `bytes ${start}-${end}/${info.size}`;\n    }\n    headers['Content-Length'] = Math.max(0, end - start + 1);\n    res.writeHead(status, headers);\n    if (req.method === 'HEAD' || info.size === 0) return res.end();\n    const stream = createReadStream(target, {start,end});\n    stream.on('error', () => res.destroy()); stream.pipe(res);\n  } catch (error) {\n    res.writeHead(error instanceof URIError ? 400 : 404); res.end('Not found');\n  }\n});\nserver.listen(port, '0.0.0.0', () => console.log(`App available on port ${port}`));\n")
              subprocess.run(['python',str(p/'prepare.py'),str(source),str(target),str(p/'spec.json'),str(p/'server.mjs')],check=True)
